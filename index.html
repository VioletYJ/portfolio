var KEY='portfolio-dashboard-key-v1';
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function ub64(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
var err=document.getElementById('err'),go=document.getElementById('go');
if(!(window.crypto&&crypto.subtle)){err.textContent='当前浏览器不支持解密，请使用最新版 Safari / Chrome 打开';go.disabled=true;return}
async function open(raw){
  var key=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));
  return new TextDecoder().decode(pt);
}
function ready(){return document.readyState==='complete'?Promise.resolve():new Promise(function(r){window.addEventListener('load',r,{once:true})})}
async function show(html){await ready();setTimeout(function(){window.__portfolioRefreshStop?.();document.open();document.write(html);document.close()},0)}
async function derive(pw){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64(P.salt),iterations:P.iter},base,256));
}
(async function(){
  var saved=null;try{saved=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  if(saved&&saved.salt===P.salt&&saved.iter===P.iter&&saved.k){
    var h=null;
    try{h=await open(b64(saved.k))}catch(e){try{localStorage.removeItem(KEY)}catch(_){}}
    if(h){await show(h);return}
  }
})();
document.getElementById('f').addEventListener('submit',async function(e){
  e.preventDefault();err.textContent='';go.disabled=true;go.textContent='解锁中…';
  try{
    var raw=await derive(document.getElementById('pw').value);
    var html=await open(raw);
    if(document.getElementById('rm').checked){try{localStorage.setItem(KEY,JSON.stringify({salt:P.salt,iter:P.iter,k:ub64(raw)}))}catch(_){}}
    show(html);
  }catch(x){err.textContent='密码不正确，请重试';go.disabled=false;go.textContent='解锁'}
});
})();

<script>
// Inlined by the build into both pages. Only public version/date metadata is fetched.
(() => {
  window.__portfolioRefreshStop?.();
  const version = document.querySelector('meta[name="portfolio-version"]')?.content;
  if (!/^[a-f0-9]{64}$/.test(version || '')) return;
  const interval = 5 * 60 * 1000;
  const pendingKey = 'portfolio-refresh-pending';
  const queryKey = '_portfolio_refresh';
  let stopped = false, busy = false, navigating = false;
  const controller = new AbortController();
  const read = key => { try { return JSON.parse(sessionStorage.getItem(key)); } catch { return null; } };
  const write = (key, value) => { try { sessionStorage.setItem(key, JSON.stringify(value)); } catch {} };
  const pending = read(pendingKey);
  // Wait until the decrypted application has initialized before restoring its view/toast.
  if (document.getElementById('toast') && pending) {
    window.dispatchEvent(new CustomEvent('portfolio-restored', {detail: pending}));
    try { sessionStorage.removeItem(pendingKey); } catch {}
  }
  const initialURL = new URL(location.href);
  if (initialURL.searchParams.get(queryKey)?.split(':')[0] === version) {
    initialURL.searchParams.delete(queryKey);
    history.replaceState(history.state, '', initialURL);
  }
  async function check() {
    if (stopped || busy || navigating || document.visibilityState !== 'visible') return;

    try {
      const url = new URL('version.json', location.href);
      url.searchParams.set('_', Date.now());
      const response = await fetch(url, {cache: 'no-store', signal: controller.signal});
      if (!response.ok) return;
      const latest = await response.json();
      if (stopped) return;
      if (!/^[a-f0-9]{64}$/.test(latest.version || '') ||
          !/^\d{4}-\d{2}-\d{2}$/.test(latest.closesDate || '') || latest.version === version) return;
      // Keep a URL fallback when sessionStorage is unavailable. A lagging CDN must not loop.
      const nextURL = new URL(location.href);
      const [target, timestamp] = (nextURL.searchParams.get(queryKey) || '').split(':');
      const previous = read('portfolio-refresh-attempt');
      const lastAttempt = Math.max(target === latest.version ? Number(timestamp) || 0 : 0,
        previous?.target === latest.version ? previous.time : 0);
      if (Date.now() - lastAttempt < interval) return;
      const time = Date.now();
      write('portfolio-refresh-attempt', {target: latest.version, time});
      const detail = {from: version, target: latest.version};
      window.dispatchEvent(new CustomEvent('portfolio-before-refresh', {detail}));
      write(pendingKey, detail);
      nextURL.searchParams.set(queryKey, `${latest.version}:${time}`);
      navigating = true;
      location.replace(nextURL.href);
    } catch { /* Offline, unavailable storage, or a deployment in progress: try again later. */ }
    finally { busy = false; }
  }
  const visible = () => { if (document.visibilityState === 'visible') check(); };
  const pageshow = event => { if (event.persisted) check(); };
  document.addEventListener('visibilitychange', visible);
  window.addEventListener('pageshow', pageshow);
  const timer = setInterval(visible, interval);
  window.__portfolioRefreshStop = () => {
    stopped = true;
    controller.abort();
    clearInterval(timer);
    document.removeEventListener('visibilitychange', visible);
    window.removeEventListener('pageshow', pageshow);
  };
  check();
})();

</script>
</body>
</html>
