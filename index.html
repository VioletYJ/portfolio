var KEY='portfolio-dashboard-key-v1';
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function ub64(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
var err=document.getElementById('err'),go=document.getElementById('go');
if(!(window.crypto&&crypto.subtle)){err.textContent='当前浏览器不支持解密，请使用最新版 Safari / Chrome 打开';go.disabled=true;return}
async function open(raw){
  var key=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));
  return new TextDecoder().decode(pt);
}
function ready(){return document.readyState==='complete'?Promise.resolve():new Promise(function(r){window.addEventListener('load',r,{once:true})})}
async function show(html){await ready();setTimeout(function(){document.open();document.write(html);document.close()},0)}
async function derive(pw){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64(P.salt),iterations:P.iter},base,256));
}
(async function(){
  var saved=null;try{saved=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  if(saved&&saved.salt===P.salt&&saved.iter===P.iter&&saved.k){
    var h=null;
    try{h=await open(b64(saved.k))}catch(e){try{localStorage.removeItem(KEY)}catch(_){}}
    if(h){await show(h);return}
  }
})();
document.getElementById('f').addEventListener('submit',async function(e){
  e.preventDefault();err.textContent='';go.disabled=true;go.textContent='解锁中…';
  try{
    var raw=await derive(document.getElementById('pw').value);
    var html=await open(raw);
    if(document.getElementById('rm').checked){try{localStorage.setItem(KEY,JSON.stringify({salt:P.salt,iter:P.iter,k:ub64(raw)}))}catch(_){}}
    show(html);
  }catch(x){err.textContent='密码不正确，请重试';go.disabled=false;go.textContent='解锁'}
});
})();
